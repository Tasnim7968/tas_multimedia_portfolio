<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoon Assignment | Tasnim Islam</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #dbeafe, #eff6ff);
      text-align: center;
      color: #1f2937;
    }

    header {
      padding: 30px 20px 10px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 20px;
    }

    canvas {
      display: block;
      margin: 0 auto 20px;
      border: 4px solid #1f2937;
      background: white;
      border-radius: 10px;
    }

    .links {
      margin-bottom: 40px;
    }

    .links a {
      display: inline-block;
      margin: 8px 10px;
      text-decoration: none;
      background: #111827;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .links a:hover {
      background: #374151;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cartoon Assignment</h1>
    <p>Created by Tasnim Islam using HTML5 Canvas and JavaScript</p>
  </header>

  <canvas id="cartoonCanvas" width="900" height="550"></canvas>

  <div class="links">
    <a href="../index.html">Back to Assignments</a>
    <a href="../../index.html">Return to Main Portfolio</a>
  </div>

</html>
